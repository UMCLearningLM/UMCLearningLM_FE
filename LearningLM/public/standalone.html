<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearningLM Flow Motion</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}.canvas{--half:min(195px,39vw);width:100vw;height:100vh;min-height:240px;position:relative;overflow:hidden;display:grid;place-items:center;background:#F5F5F7}.connection{--from:#4A5E8A;--to:#2F8190;position:absolute;z-index:1;top:50%;width:calc(50% - var(--half));height:4px;pointer-events:none}.connection:before{content:"";position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,var(--from),var(--to));opacity:.65}.cin{left:0;transform-origin:right;transform:scaleX(0)}.cin.animate{animation:connectIn .72s both}.cout{right:0;transform:scaleX(0);transform-origin:left;opacity:0}.cout.active{animation:connectOut .78s both}.card{--c:#4A5E8A;position:absolute;width:min(390px,78vw);min-height:258px;display:grid;grid-template-rows:auto 1fr auto;padding:24px 22px 0;border:1.5px solid #E4E4E7;border-radius:21px;background:#fff;box-shadow:0 18px 42px rgba(39,39,42,.09);transition:transform .72s cubic-bezier(.22,.78,.24,1),opacity .58s,filter .58s}.card.current{z-index:2;transform:none;opacity:1;filter:none;animation:stageIn .72s cubic-bezier(.22,.78,.24,1)}.card.past{z-index:1;transform:translateX(-125%);opacity:0;filter:blur(4px)}.card.future{z-index:0;transform:translateX(125%);opacity:0;filter:blur(4px)}.port{position:absolute;top:50%;width:17px;height:17px;border:4px solid var(--c);border-radius:50%;background:#fff;transform:translateY(-50%)}.pin{left:-9px}.pout{right:-9px}.heading{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:13px}.num{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--c);color:#fff;font-size:20px;font-weight:800}.title strong{display:block;color:#27272A;font-size:22px;line-height:1.05;letter-spacing:-.05em}.title small{display:block;margin-top:8px;color:#9A9AA3;font-size:11px}.req{padding:8px 10px;border-radius:10px;background:#EEF4EE;color:#2F7D52;font-size:12px;white-space:nowrap}.stack{display:grid;align-content:center;gap:10px;padding:18px 0 14px}.block{height:52px;display:grid;grid-template-columns:9px minmax(0,1fr) auto;align-items:center;gap:11px;padding:0 14px;border:1.5px solid #E4E4E7;border-radius:11px;background:#fff;opacity:0;transform:translateX(-58px);transition:opacity .48s,transform .62s cubic-bezier(.18,.82,.25,1.13),box-shadow .45s}.block.visible{opacity:1;transform:none;box-shadow:0 5px 14px rgba(39,39,42,.045)}.block i{width:8px;height:8px;border-radius:2px;background:var(--c)}.block strong{overflow:hidden;color:#27272A;font-size:15px;letter-spacing:-.035em;white-space:nowrap;text-overflow:ellipsis}.block span{color:#9A9AA3;font-size:12px;white-space:nowrap}.foot{height:50px;display:flex;align-items:center;justify-content:flex-start;border-top:1.5px dashed #E4E4E7;color:var(--c);font-size:14px;font-weight:700}@keyframes stageIn{from{transform:translateX(125%);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}@keyframes connectIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}@keyframes connectOut{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}@media(max-width:420px){.card{width:82vw;min-height:74vw;padding:5vw 4.5vw 0;border-radius:4.4vw}.num{width:10vw;height:10vw;border-radius:2.8vw;font-size:4.8vw}.title strong{font-size:5.2vw}.title small{margin-top:1.5vw;font-size:2.6vw}.req{padding:1.8vw 2vw;font-size:2.8vw}.stack{gap:2.2vw;padding:4vw 0 3vw}.block{height:13vw;padding:0 3vw}.block strong{font-size:3.6vw}.block span{font-size:2.8vw}.foot{height:12vw;font-size:3.3vw}}
</style></head><body><main class="canvas" id="canvas"></main><script>
const stages=[{n:'입력',e:'INPUT',c:'#4A5E8A',r:'필수 2/2',b:[['텍스트 입력','리뷰 100건'],['필요한 스킬','요약']]},{n:'컨텍스트',e:'CONTEXT',c:'#2F8190',r:'필수 1/1',b:[['역할 부여','리뷰 분석가'],['제약조건','짧게']]},{n:'프로세스',e:'PROCESS',c:'#6366F1',r:'필수 2/2',b:[['핵심 내용 추출','핵심만'],['요약하기','3줄 요약']]},{n:'검토',e:'REVIEW',c:'#B07A2E',r:'필수 2/2',b:[['누락 확인','전체 항목'],['형식 확인','문서 형식']]},{n:'결과',e:'OUTPUT',c:'#3C7A52',r:'필수 2/2',b:[['텍스트로 출력','최종 결과'],['내 저장소에 저장','워크플로우']]}],root=document.querySelector('#canvas');root.innerHTML='<div class="connection cin"></div><div class="connection cout"></div>'+stages.map((s,i)=>`<article class="card" data-i="${i}" style="--c:${s.c}"><i class="port pin"></i><i class="port pout"></i><header class="heading"><span class="num">${i+1}</span><div class="title"><strong>${s.n}</strong><small>${s.e}</small></div><b class="req">${s.r}</b></header><div class="stack">${s.b.map((b,j)=>`<div class="block" data-b="${j}"><i></i><strong>${b[0]}</strong><span>${b[1]}</span></div>`).join('')}</div><footer class="foot"><span>다음 단계로 전달</span></footer></article>`).join('');let tick=0;function draw(){const current=Math.floor(tick/4),reveal=tick%4,previous=(current+4)%5,next=(current+1)%5,cin=document.querySelector('.cin'),cout=document.querySelector('.cout');cin.style.setProperty('--from',stages[previous].c);cin.style.setProperty('--to',stages[current].c);cout.style.setProperty('--from',stages[current].c);cout.style.setProperty('--to',stages[next].c);if(reveal===0){cin.classList.remove('animate');void cin.offsetWidth;cin.classList.add('animate')}cout.classList.toggle('active',reveal===3);document.querySelectorAll('.card').forEach((card,i)=>{card.className='card '+(i===current?'current':i===previous?'past':'future');card.querySelectorAll('.block').forEach((block,j)=>block.classList.toggle('visible',j<reveal))})}draw();setInterval(()=>{tick=tick>=19?0:tick+1;draw()},850);
</script></body></html>
